<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PumpScannerPro</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
}

h1{
    margin:0;
    color:#22c55e;
}

button{
    background:#22c55e;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #333;
    text-align:left;
}

th{
    background:#1e293b;
}
</style>

</head>

<body>

<header>
<h1>🚀 PumpScannerPro</h1>
<p>Scanner Pump.fun - Solana</p>

<button onclick="charger()">Actualiser</button>
</header>

<table>

<thead>

<tr>
<th>Nom</th>
<th>Score</th>
<th>Prix</th>
<th>Volume</th>
</tr>

</thead>

<tbody id="tableau">

</tbody>

</table>

<script>

async function charger(){

const res=await fetch("/api/scan");

const json=await res.json();

const tbody=document.getElementById("tableau");

tbody.innerHTML="";

json.data.forEach(token=>{

tbody.innerHTML+=`
<tr>

<td>${token.name}</td>

<td>${token.viralScore}</td>

<td>$${token.price}</td>

<td>$${Number(token.volume24h).toLocaleString()}</td>

</tr>
`;

});

}

charger();

</script>

</body>
</html>
