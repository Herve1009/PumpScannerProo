<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - PumpScannerPro</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

<h1>PumpScannerPro</h1>

<h2>Connexion</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Adresse e-mail"
required>

<input
type="password"
id="password"
placeholder="Mot de passe"
required>

<button type="submit">
Se connecter
</button>

</form>

<div id="message" class="message"></div>

<p style="margin-top:20px;text-align:center;">
Pas encore de compte ?
<a href="register.html">
Créer un compte
</a>
</p>

</div>

<script src="js/login.js"></script>

</body>
</html>
