<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PumpScannerPro Dashboard</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">
<h1>🚀 PumpScannerPro</h1>

<button id="logoutBtn">
Déconnexion
</button>
</header>

<div class="container">

<h2>Bienvenue</h2>

<p id="welcome"></p>

<div class="card">
<h3>👤 Mon compte</h3>

<p><strong>Email :</strong> <span id="email"></span></p>

<p><strong>WhatsApp :</strong> <span id="whatsapp"></span></p>

<p><strong>Pays :</strong> <span id="country"></span></p>

<p><strong>Abonnement :</strong>
<span id="role"></span>
</p>

</div>

<div class="card">

<h3>📡 Scanner Pump.fun</h3>

<p>
Les nouveaux signaux apparaîtront ici.
</p>

<button>
Lancer le Scanner
</button>

</div>

<div class="card">

<h3>💎 Premium</h3>

<p>

Passez Premium pour recevoir
les signaux directement sur WhatsApp.

</p>

<button>

Devenir Premium

</button>

</div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
