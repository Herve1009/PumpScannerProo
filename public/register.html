<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpScannerPro - Inscription</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>Créer un compte</h1>

    <form id="registerForm">

        <input
            type="text"
            id="fullName"
            placeholder="Nom complet"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
        >

        <input
            type="text"
            id="whatsapp"
            placeholder="WhatsApp (+237...)"
            required
        >

        <input
            type="text"
            id="country"
            placeholder="Pays"
            required
        >

        <button type="submit">
            Créer mon compte
        </button>

    </form>

    <div id="message" class="message"></div>

    <p>
        Déjà inscrit ?
        <a href="login.html">Se connecter</a>
    </p>

</div>

<script src="js/register.js"></script>

</body>
</html>
